{% extends "base.html" %}
{% block content %}
  <div style="max-width:520px; margin:0 auto;">
    <div class="auth-card">
      <span class="badge" style="border-color:var(--teal); color:var(--teal);">FREE ACCOUNT</span>
      <h2>Create your LearnHub account</h2>
      <p class="desc">Sign up to unlock the full Linux course, track your progress, and start the live Ubuntu practicals.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary" style="width:100%;">Create account &amp; start learning</button>
      </form>
      <p class="meta" style="margin-top:16px;">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </div>
  </div>
{% endblock %}
